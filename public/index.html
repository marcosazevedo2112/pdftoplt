<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PDF → PLT</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-slate-950 text-slate-100">
  <main class="mx-auto flex min-h-screen max-w-3xl items-center px-6 py-12">
    <section class="w-full rounded-2xl border border-slate-800 bg-slate-900 p-8 shadow-2xl">
      <div class="mb-8">
        <p class="mb-2 text-sm font-semibold uppercase tracking-widest text-cyan-400">POC</p>
        <h1 class="text-4xl font-bold">PDF → PLT</h1>
        <p class="mt-3 text-slate-400">
          Converte caminhos vetoriais de um PDF de uma página em comandos HP-GL,
          preservando a escala 1:1.
        </p>
      </div>

      <form id="form" class="space-y-5">
        <label class="block">
          <span class="mb-2 block text-sm font-medium">Arquivo PDF vetorial</span>
          <input
            id="pdf"
            name="pdf"
            type="file"
            accept=".pdf,application/pdf"
            required
            class="block w-full cursor-pointer rounded-lg border border-slate-700 bg-slate-950 p-3 text-sm text-slate-300 file:mr-4 file:rounded-md file:border-0 file:bg-cyan-500 file:px-4 file:py-2 file:font-semibold file:text-slate-950 hover:file:bg-cyan-400"
          >
        </label>

        <button
          id="submit"
          type="submit"
          class="w-full rounded-lg bg-cyan-500 px-5 py-3 font-bold text-slate-950 transition hover:bg-cyan-400 disabled:cursor-not-allowed disabled:opacity-50"
        >Converter</button>
      </form>

      <div id="status" class="mt-6 hidden rounded-lg border p-4 text-sm"></div>

      <section id="result" class="mt-6 hidden rounded-xl border border-emerald-900 bg-emerald-950/30 p-5">
        <h2 class="text-xl font-bold text-emerald-300">Conversão concluída</h2>

        <dl class="mt-4 grid gap-3 sm:grid-cols-2">
          <div><dt class="text-xs uppercase text-slate-500">Arquivo</dt><dd id="file" class="font-mono text-sm"></dd></div>
          <div><dt class="text-xs uppercase text-slate-500">Dimensões</dt><dd id="dimensions" class="font-mono text-sm"></dd></div>
          <div><dt class="text-xs uppercase text-slate-500">Paths</dt><dd id="paths" class="font-mono text-sm"></dd></div>
          <div><dt class="text-xs uppercase text-slate-500">Segmentos</dt><dd id="segments" class="font-mono text-sm"></dd></div>
          <div><dt class="text-xs uppercase text-slate-500">Curvas</dt><dd id="curves" class="font-mono text-sm"></dd></div>
          <div><dt class="text-xs uppercase text-slate-500">Escala</dt><dd id="scale" class="font-mono text-sm"></dd></div>
        </dl>

        <a id="download" href="#"
          class="mt-5 inline-flex rounded-lg bg-emerald-500 px-5 py-3 font-bold text-slate-950 hover:bg-emerald-400">
          Baixar PLT
        </a>
      </section>
    </section>
  </main>

  <script>
    const form = document.getElementById("form");
    const input = document.getElementById("pdf");
    const submit = document.getElementById("submit");
    const status = document.getElementById("status");
    const result = document.getElementById("result");

    form.addEventListener("submit", async event => {
      event.preventDefault();

      if (!input.files.length) {
        showStatus("Selecione um PDF.", false);
        return;
      }

      submit.disabled = true;
      submit.textContent = "Processando...";
      result.classList.add("hidden");
      showStatus("Processando arquivo...", true);

      const formData = new FormData();
      formData.append("pdf", input.files[0]);

      try {
        const response = await fetch("/convert", {
          method: "POST",
          body: formData
        });
        const data = await response.json();

        if (!response.ok || !data.success) {
          throw new Error(data.error || "Falha na conversão.");
        }

        document.getElementById("file").textContent = data.file;
        document.getElementById("dimensions").textContent =
          data.dimensions.widthMm.toFixed(2) + " mm × " +
          data.dimensions.heightMm.toFixed(2) + " mm";
        document.getElementById("paths").textContent = data.geometry.paths;
        document.getElementById("segments").textContent = data.geometry.segments;
        document.getElementById("curves").textContent = data.geometry.curves;
        document.getElementById("scale").textContent =
          data.scale.ratio + " · " + data.scale.hpglUnitsPerMm + " unidades/mm";

        const download = document.getElementById("download");
        download.href = data.downloadUrl;
        download.download = data.file;

        status.classList.add("hidden");
        result.classList.remove("hidden");
      } catch (error) {
        result.classList.add("hidden");
        showStatus(error.message, false);
      } finally {
        submit.disabled = false;
        submit.textContent = "Converter";
      }
    });

    function showStatus(message, processing) {
      status.textContent = message;
      status.className =
        "mt-6 rounded-lg border p-4 text-sm " +
        (processing
          ? "border-sky-900 bg-sky-950/40 text-sky-200"
          : "border-red-900 bg-red-950/40 text-red-200");
      status.classList.remove("hidden");
    }
  </script>
</body>
</html>
